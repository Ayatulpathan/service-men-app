services:
  - type: web
    name: service-men-backend
    env: node
    buildCommand: npm install && npx prisma db push && npx tsx prisma/seed.ts
    startCommand: npm run server
    envVars:
      - key: PORT
        value: 5000

  - type: web
    name: service-men-frontend
    env: static
    buildCommand: npm run build
    staticPublishPath: ./dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
